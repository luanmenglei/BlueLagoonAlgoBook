name: Verify and print BlueLagoon

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notebook-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notebook:
    name: C++20 tests and printable PDF
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      CXX: g++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install highlighting dependency
        run: python -m pip install -r requirements.txt
      - name: Independent compilation and stress tests
        run: python scripts/verify.py
      - name: Install print dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-lang-chinese texlive-fonts-recommended \
            fonts-noto-cjk lmodern tex-gyre fonts-texgyre fonts-texgyre-math
          fc-cache -f
      - name: Generate PDF
        run: python scripts/build.py
      - name: Package portable notebook
        run: python scripts/pack.py
      - name: Upload printable notebook and verification report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: BlueLagoon-print
          path: |
            output/
            tests/report.json
            build/xelatex-console.log
          if-no-files-found: error
          retention-days: 90
      - name: Upload portable source package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: BlueLagoon-portable
          path: ../BlueLagoon.zip
          if-no-files-found: error
          retention-days: 90
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: BlueLagoon-diagnostics
          path: |
            tests/report.json
            build/tests/*.log
            build/xelatex-console.log
          if-no-files-found: warn
          retention-days: 14
